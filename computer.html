<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="/static/js/cookies.js"></script>
    <link rel="stylesheet" href="/static/css/cookies.css">
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171615">
    <meta name="color-scheme" content="dark">
    <title>Novo chat</title>
    <link rel="icon" type="image/png" href="/static/img/icons/widget-dark.png">
    <script src="./static/js/theme.js"></script>
    <link rel="stylesheet" href="./static/css/globals.css">
    <link rel="stylesheet" href="./static/css/principal.css">
    <link rel="stylesheet" href="./static/css/home.css">
    <link rel="stylesheet" href="./static/css/computer.css">
    <link rel="stylesheet" href="/static/css/sessions.css">
    <link rel="stylesheet" href="/static/css/chat-search.css">
    <script src="/static/js/chat-search.js" defer></script>
    <script src="/static/js/sessions.js" defer></script>
    <script src="/static/js/chat-preview.js" defer></script>
    <script src="./static/js/computer-service.js" defer></script>
    <script src="./static/js/model-menu.js" defer></script>
    <script src="./static/js/response-details.js" defer></script>
    <script src="/static/js/attachments.js" defer></script>
    <script src="./static/js/computer.js" defer></script>
    <script src="./static/js/dictation.js" defer></script>
    <script src="./static/js/sidebar.js" defer></script>
    <script src="./static/js/profile-menu.js" defer></script>
    <script src="/static/js/discovery-panel.js" defer></script>
</head>
<body class="workspace">
{% with active_page='computer' %}{% include 'templates/partials/sidebar.html' %}{% endwith %}
    <button class="sidebar-backdrop" type="button" tabindex="-1" aria-label="Fechar menu" hidden></button>
    <main class="workspace__content" aria-label="Área de trabalho">
        <header class="workspace__header computer-header">
            <div class="workspace__mobile-brand">
                <button class="workspace__header-button workspace__menu-toggle" type="button" aria-label="Abrir menu lateral" aria-expanded="false" aria-controls="sidebar">
                    <span class="workspace__mobile-menu-icon" aria-hidden="true"></span>
                </button>
                <span class="workspace__brand-logo" role="img" aria-label="Ascenda"></span>
            </div>
            <span class="computer-chat-title"></span>
            <nav class="chat-tabs" aria-label="Visualização da resposta" hidden><button type="button" data-chat-view="answer" aria-current="page"><i class="chat-tab-logo" aria-hidden="true"></i>Resposta</button><button type="button" data-chat-view="links"><i class="chat-tab-links" aria-hidden="true"></i>Links</button></nav>
            <button class="workspace__header-button anonymous-toggle" type="button" aria-label="Ativar modo anônimo" aria-pressed="false"><i aria-hidden="true"></i></button>
            <button class="workspace__header-button mobile-discover-toggle" type="button" aria-label="Abrir Descobrir" aria-controls="mobile-discovery-panel" aria-expanded="false"><span class="sidebar__discover-icon" aria-hidden="true"></span></button>
        </header>

        <section class="computer-page" aria-labelledby="computer-title">
            <div class="computer-intro">
                <h1 id="computer-title"><svg class="computer-intro__animated-logo" aria-hidden="true" width="44" height="36" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M35.9999 6.00192C35.9999 4.89618 35.1026 4.00128 33.9992 4.00128H9.9986C8.8952 4.00128 7.99796 4.89618 7.99796 6.00192V22.0047C7.99796 23.1104 8.8952 24.0053 9.9986 24.0053H33.9992C35.1026 24.0053 35.9999 23.1104 35.9999 22.0047V6.00192ZM39.9988 22.0047C39.9988 25.3196 37.3118 28.0066 33.9992 28.0066H9.9986C6.68606 28.0066 3.99902 25.3196 3.99902 22.0047V6.00192C3.99902 2.68704 6.68606 0 9.9986 0H33.9992C37.3118 0 39.9988 2.68704 39.9988 6.00192V22.0047Z" fill="currentColor"/>
<path d="M41.9994 32.0079C43.1028 32.0079 44 32.9052 44 34.0086C44 35.1143 43.1028 36.0092 41.9994 36.0092H1.9983C0.894899 36.0092 0 35.1143 0 34.0086C0 32.9028 0.894899 32.0079 1.9983 32.0079H41.9994Z" fill="currentColor"/>
<g class="computer-eyes">
<path d="M15.9307 10.2129V13.7946C15.9307 14.8996 16.8264 15.7953 17.9313 15.7953C19.0363 15.7953 19.9319 14.8996 19.9319 13.7946V10.2129C19.9319 9.10797 19.0363 8.21228 17.9313 8.21228C16.8264 8.21228 15.9307 9.10797 15.9307 10.2129Z" fill="currentColor"/>
<path d="M23.9307 10.2129V13.7946C23.9307 14.8996 24.8264 15.7953 25.9313 15.7953C27.0363 15.7953 27.9319 14.8996 27.9319 13.7946V10.2129C27.9319 9.10797 27.0363 8.21228 25.9313 8.21228C24.8264 8.21228 23.9307 9.10797 23.9307 10.2129Z" fill="currentColor"/>
</g>
<style>
.computer-eyes {
    transform-box: fill-box;
    transform-origin: center;
    animation: computer-look 10s ease-in-out infinite;
}

@keyframes computer-look {
    0%, 100% {
        transform: translateX(0) scaleY(1);
    }

    15%, 28%, 34%, 42% {
        transform: translateX(-3px) scaleY(1);
    }

    31% {
        transform: translateX(-3px) scaleY(.12);
    }

    65%, 78%, 84%, 92% {
        transform: translateX(3px) scaleY(1);
    }

    81% {
        transform: translateX(3px) scaleY(.12);
    }

}

@media (prefers-reduced-motion: reduce) {
    .computer-eyes {
        animation: none;
    }

}
</style>
</svg>
<span data-chat-greeting data-account-name="{{ user.nome }}" data-account-id="{{ user.id }}">Olá</span></h1>
            </div>
            <button class="computer-history__older" type="button" hidden>Carregar mensagens anteriores</button>
            <section class="computer-messages" aria-label="Conversa com Computer" aria-live="polite" aria-relevant="additions text" hidden></section>
            <div class="computer-composer">
                <form class="home__composer" aria-label="Escrever uma mensagem">
                    <p class="home__dictation-status" role="status" aria-live="polite" id="dictation-status"></p>
                    <div class="attachment-list" aria-label="Arquivos anexados" hidden></div>
                    <p class="attachment-status" role="status"></p>
                    <textarea class="home__input" aria-label="Mensagem" placeholder="Pergunte qualquer coisa" rows="2" maxlength="8000" readonly></textarea>
                    <div class="home__toolbar">
                        <div class="home__modes" role="group" aria-label="Modo da mensagem">
                            <button class="attachment-toggle" type="button" popovertarget="attachment-menu" aria-label="Adicionar arquivos ou imagens"><svg class="attachment-plus" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                            <div id="attachment-menu" class="attachment-menu" popover><button type="button" data-upload-files><i aria-hidden="true"></i>Enviar arquivos ou imagens</button><p>PNG, JPG, WebP, PDF, DOCX ou texto · até 8 MB</p></div>
                            <input id="attachment-input" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.html,.css,.log" hidden>
                            <div class="composer-provider-group"><button class="model-picker" type="button" title="Escolher modelo (Qwen selecionado)"><i class="model-icon model-icon--gemini" aria-hidden="true"></i><span>Gemini</span></button><button class="home__mode computer-provider" type="button" aria-pressed="false"><i class="computer-icon" aria-hidden="true"></i><span>Computer</span></button></div>
                        </div>
                        <div class="home__actions">

<button class="local-model-picker" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="computer-model-menu" hidden><span class="local-model-name">4b no-think</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
                            <div class="model-menu" id="computer-model-menu" popover role="menu" aria-label="Modelos locais"><button type="button" role="menuitemradio" aria-checked="true" data-provider="qwen3:4b-instruct-2507-q4_K_M"><i class="model-icon model-icon--qwen" aria-hidden="true"></i><span>4b no-think</span><i class="model-check" aria-hidden="true"></i></button><button type="button" role="menuitemradio" aria-checked="false" data-provider="qwen3:1.7b"><i class="model-icon model-icon--qwen" aria-hidden="true"></i><span>1.7b</span><i class="model-check" aria-hidden="true"></i></button><button type="button" role="menuitemradio" aria-checked="false" data-provider="qwen3:4b"><i class="model-icon model-icon--qwen" aria-hidden="true"></i><span>4b</span><i class="model-check" aria-hidden="true"></i></button><button type="button" role="menuitemradio" aria-checked="false" data-provider="qwen3:8b"><i class="model-icon model-icon--qwen" aria-hidden="true"></i><span>8b</span><i class="model-check" aria-hidden="true"></i></button></div>
                            <button class="home__microphone" type="button" aria-label="Ditar mensagem" aria-pressed="false" aria-describedby="dictation-status"><span class="microphone-icon" aria-hidden="true"></span></button>
                            <button class="home__send" type="submit" aria-label="Enviar mensagem"><i class="ui-arrow" aria-hidden="true"></i></button>
                        </div>
                    </div>
                </form>
                <p class="anonymous-note" hidden>Esse chat não será salvo no histórico</p>
                <p class="computer-note" role="status"></p>
            </div>
        </section>
        <section class="chat-links" aria-label="Links pesquisados" hidden></section>
    </main>
    <dialog class="mobile-discovery-panel" id="mobile-discovery-panel" aria-label="Descobrir">
        <div class="mobile-discovery-panel__header"><button type="button" class="mobile-discovery-back" aria-label="Voltar"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i></button><span>Descobrir</span></div>
        <iframe title="Notícias do Descobrir" data-src="/descobrir.html?panel=1"></iframe>
    </dialog>
{% include 'settings.html' %}
<script src="/static/js/message-navigator.js" defer></script>
<script src="/static/js/chat-greeting.js" defer></script>
<script src="/static/js/tooltips.js" defer></script>
</body>
</html>
