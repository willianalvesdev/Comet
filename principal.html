<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171615">
    <meta name="color-scheme" content="dark">
    <title>Ascenda — Tela principal</title>
    <link rel="icon" type="image/svg+xml" data-page-icon="./static/img/icons/computer-favicon.svg" href="./static/img/icons/computer-favicon.svg">
    <script src="./static/js/theme.js"></script>
    <link rel="stylesheet" href="./static/css/globals.css">
    <link rel="stylesheet" href="./static/css/principal.css">
    <link rel="stylesheet" href="./static/css/home.css">
    <script src="./static/js/home.js" defer></script>
    <script src="./static/js/dictation.js" defer></script>
    <script src="./static/js/sidebar.js" defer></script>
    <script src="./static/js/profile-menu.js" defer></script>
</head>
<body class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
        <div class="sidebar__top">
            <a class="sidebar__logo" href="./principal.html" aria-label="Ascensão — tela principal"></a>
            <button class="sidebar__toggle" type="button" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar-nav" title="Recolher menu">
                <span class="sidebar__toggle-icon" aria-hidden="true"></span>
            </button>
        </div>

        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegação principal">
            <button class="sidebar__link" type="button" aria-label="Computer" title="Computer">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="12" rx="2"/>
                    <path d="M2 20h20M9 8v4m6-4v4"/>
                </svg>
                <span class="sidebar__label">Computer</span>
            </button>
            <button class="sidebar__link" type="button" aria-label="Artefatos" title="Artefatos">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="3" width="16" height="18" rx="2"/>
                    <path d="m10 3 4 18M4 12h8"/>
                </svg>
                <span class="sidebar__label">Artefatos</span>
            </button>
            <button class="sidebar__link" type="button" aria-label="Personalizar" title="Personalizar">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m12 2 9 5v10l-9 5-9-5V7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="sidebar__label">Personalizar</span>
            </button>
            <a class="sidebar__link" href="./graficos.html" aria-label="Gráficos" title="Gráficos">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3v18h18M6 15l4-5 4 3 6-8"/>
                </svg>
                <span class="sidebar__label">Gráficos</span>
            </a>
            <a class="sidebar__link" href="./descobrir.html" aria-label="Descobrir" title="Descobrir"><span class="sidebar__icon sidebar__discover-icon" aria-hidden="true"></span><span class="sidebar__label">Descobrir</span></a>
        </nav>

        <div class="sidebar__footer">
<button class="sidebar__profile" type="button" popovertarget="profile-menu" aria-expanded="false" aria-controls="profile-menu" aria-label="Abrir menu do perfil">
            <span class="sidebar__avatar" aria-hidden="true">{{ user.nome[0]|upper }}</span>
            <span class="sidebar__profile-info">
                <span class="sidebar__profile-label" title="{{ user.nome }}">{{ user.nome }}</span>
                <span class="sidebar__profile-email" title="{{ user.email }}">{{ user.email }}</span>
            </span>
            <span class="sidebar__profile-open" aria-hidden="true"></span>
        </button>
        <button class="sidebar__notification" type="button" aria-label="Notificações" title="Notificações"><span aria-hidden="true"></span></button>
        </div>

        <div class="profile-menu" id="profile-menu" popover aria-label="Menu do perfil">
            <div class="profile-menu__main">
                <div class="profile-menu__identity"><span class="sidebar__avatar">{{ user.nome[0]|upper }}</span><div><span>{{ user.nome }}</span><small>{{ user.email }}</small></div></div>
                <button class="profile-menu__item" type="button" data-profile-submenu="appearance" aria-expanded="false" aria-controls="profile-appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg><span>Aparência<small data-theme-label>Escuro</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
                <button class="profile-menu__item" type="button" data-profile-submenu="language" aria-expanded="false" aria-controls="profile-language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h12M9 3v2M5 5c0 6 7 10 7 10M13 5c0 6-8 10-8 10m10 6 4-10 4 10m-6-4h4"/></svg><span>Idioma<small>Português (Brasil)</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
                <div class="profile-menu__divider"></div>
                <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="profile-menu__item" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H4v16h6m4-12 4 4-4 4m-6-4h10"/></svg><span>Sair</span></button></form>
            </div>
            <div class="profile-menu__submenu" id="profile-appearance" aria-label="Aparência" hidden>
                <button class="profile-menu__back" type="button">‹ Aparência</button>
                <button class="profile-menu__item" type="button" data-theme-choice="light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg><span>Claro</span><span class="profile-menu__check" aria-hidden="true">✓</span></button>
<button class="profile-menu__item" type="button" data-theme-choice="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg><span>Escuro</span><span class="profile-menu__check" aria-hidden="true">✓</span></button>
<button class="profile-menu__item" type="button" data-theme-choice="system" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span>Sistema</span><span class="profile-menu__check" aria-hidden="true">✓</span></button>
            </div>
            <div class="profile-menu__submenu profile-menu__languages" id="profile-language" aria-label="Idioma" hidden>
                <button class="profile-menu__back" type="button">‹ Idioma</button>
                <button class="profile-menu__item" type="button"><span>Português (Brasil)</span><span class="profile-menu__check" aria-hidden="true">✓</span></button>
                <button class="profile-menu__item" type="button"><span>English</span></button>
            </div>
        </div>
    </aside>
    <button class="sidebar-backdrop" type="button" tabindex="-1" aria-label="Fechar menu" hidden></button>
    <main class="workspace__content" aria-label="Área de trabalho">
        <header class="workspace__header">
            <div class="workspace__mobile-brand">
                <button class="workspace__header-button workspace__menu-toggle" type="button" aria-label="Abrir menu lateral" aria-expanded="false" aria-controls="sidebar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
                </button>
                <span class="workspace__brand-logo" role="img" aria-label="Ascensão"></span>
            </div>
            <span class="workspace__title">Rota Financeira</span>
        </header>

        <section class="home" aria-labelledby="home-title">
            <div class="home__inner">
                <div class="home__heading" aria-live="polite">
                    <p class="home__eyebrow" id="home-mode">Busca</p>
                    <h1 id="home-title">O que você quer saber?</h1>
                </div>
                <form class="home__composer" aria-label="Escrever uma mensagem">
                    <p class="home__dictation-status" role="status" aria-live="polite" id="dictation-status"></p>
                    <textarea class="home__input" aria-label="Mensagem" placeholder="Digite sua pergunta..." rows="2"></textarea>
                    <div class="home__toolbar">
                        <div class="home__modes" role="group" aria-label="Modo da mensagem">
                            <button class="home__mode" type="button" data-composer-mode="default" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><span>Padrão</span></button>
                            <button class="home__mode" type="button" data-composer-mode="computer" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20M9 8v4m6-4v4"/></svg><span>Computer</span></button>
                        </div>
                        <div class="home__actions">
                            <button class="home__microphone" type="button" aria-label="Ditar mensagem" aria-pressed="false" aria-describedby="dictation-status"><svg width="13" height="20" aria-hidden="true" focusable="false" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M2.75 18.5H5.75V16.4482C2.51357 16.019 0 12.8493 0 9C0 8.7193 0.234954 8.50016 0.515625 8.5H0.818359C1.0888 8.5 1.2998 8.72956 1.2998 9C1.2998 12.3137 3.62812 15 6.5 15C9.37188 15 11.7002 12.3137 11.7002 9C11.7002 8.72956 11.9112 8.5 12.1816 8.5H12.4844C12.765 8.50016 13 8.7193 13 9C13 12.8493 10.4864 16.019 7.25 16.4482V18.5H10.25C10.6642 18.5 11 18.8358 11 19.25C11 19.6642 10.6642 20 10.25 20H2.75C2.33579 20 2 19.6642 2 19.25C2 18.8358 2.33579 18.5 2.75 18.5Z" fill="currentColor"/>
<path fill-rule="evenodd" clip-rule="evenodd" d="M6.5 0C8.433 0 10 1.567 10 3.5V10C10 11.933 8.433 13.5 6.5 13.5C4.567 13.5 3 11.933 3 10V3.5C3 1.567 4.567 0 6.5 0ZM6.5 1.5C5.39543 1.5 4.5 2.39543 4.5 3.5V10C4.5 11.1046 5.39543 12 6.5 12C7.60457 12 8.5 11.1046 8.5 10V3.5C8.5 2.39543 7.60457 1.5 6.5 1.5Z" fill="currentColor"/>
</svg></button>
                            <button class="home__send" type="submit" aria-label="Enviar mensagem"><svg width="13" height="13" aria-hidden="true" focusable="false" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M5.68312 0.238626C5.98875 -0.0795421 6.48517 -0.0795421 6.7908 0.238626L11.7708 5.42398C12.0764 5.74216 12.0764 6.25789 11.7708 6.57605L6.7908 11.7614C6.48518 12.0795 5.98874 12.0795 5.68312 11.7614C5.3775 11.4432 5.37752 10.9265 5.68312 10.6083L9.32818 6.81474H0.782614C0.350409 6.81474 3.44182e-05 6.44994 0 6.00002C0 5.55006 0.350388 5.1853 0.782614 5.1853H9.32818L5.68312 1.39175C5.3775 1.0736 5.37752 0.556797 5.68312 0.238626Z" fill="currentColor"/>
</svg></button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
