services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config:/etc/searxng
      - cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
volumes:
  cache:
