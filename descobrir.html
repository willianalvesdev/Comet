<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171615">
    <meta name="color-scheme" content="dark">
    <title>Ascenda — Descobrir</title>
    <link rel="icon" type="image/svg+xml" href="./static/img/icons/favicon.svg">
    <script src="./static/js/theme.js"></script>
    <link rel="stylesheet" href="./static/css/globals.css">
    <link rel="stylesheet" href="./static/css/principal.css">
    <link rel="stylesheet" href="./static/css/news.css">
    <script src="./static/js/sidebar.js" defer></script>
    <script src="./static/js/profile-menu.js" defer></script>
    <script src="./static/js/news.js" defer></script>
    <script src="/static/js/weather.js" defer></script>
    <script src="/static/js/discovery-panel.js" defer></script>
</head>
<body class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Menu lateral">
        <div class="sidebar__top">
            <a class="sidebar__logo" href="./principal.html" aria-label="Ascensão — tela principal"></a>
            <button class="sidebar__toggle" type="button" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar-nav" title="Recolher menu">
                <span class="sidebar__toggle-icon" aria-hidden="true"></span>
            </button>
        </div>

        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegação principal">
            <a class="sidebar__link" href="./principal.html" aria-label="Novo" title="Novo"><span class="sidebar__new-icon" aria-hidden="true"></span><span class="sidebar__label">Novo</span></a>
            <button class="sidebar__link" type="button" aria-label="Computer" title="Computer">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="12" rx="2"/>
                    <path d="M2 20h20M9 8v4m6-4v4"/>
                </svg>
                <span class="sidebar__label">Computer</span>
            </button>
            <button class="sidebar__link" type="button" aria-label="Personalizar" title="Personalizar">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m12 2 9 5v10l-9 5-9-5V7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="sidebar__label">Personalizar</span>
            </button>
            <a class="sidebar__link" href="./graficos.html" aria-label="Gráficos" title="Gráficos">
                <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 3v18h18M6 15l4-5 4 3 6-8"/>
                </svg>
                <span class="sidebar__label">Gráficos</span>
            </a>
            <a class="sidebar__link" href="./descobrir.html" aria-current="page" aria-label="Descobrir" title="Descobrir"><span class="sidebar__icon sidebar__discover-icon" aria-hidden="true"></span><span class="sidebar__label">Descobrir</span></a>
        </nav>

        <div class="sidebar__footer">
<button class="sidebar__profile" type="button" popovertarget="profile-menu" aria-expanded="false" aria-controls="profile-menu" aria-label="Abrir menu do perfil">
            <span class="sidebar__avatar" aria-hidden="true">{{ user.nome[0]|upper }}</span>
            <span class="sidebar__profile-info">
                <span class="sidebar__profile-label" title="{{ user.nome }}">{{ user.nome }}</span>
                <span class="sidebar__profile-email" title="{{ user.email }}">{{ user.email }}</span>
            </span>
            <span class="sidebar__profile-open" aria-hidden="true"></span>
        </button>
        <button class="sidebar__notification" type="button" aria-label="Notificações" title="Notificações"><span aria-hidden="true"></span></button>
        </div>

        <div class="profile-menu" id="profile-menu" data-user-id="{{ user.id }}" popover aria-label="Menu do perfil">
            <div class="profile-menu__main">
                <div class="profile-menu__identity"><span class="sidebar__avatar">{{ user.nome[0]|upper }}</span><div><span>{{ user.nome }}</span><small>{{ user.email }}</small></div></div>
                <button class="profile-menu__item" type="button" data-profile-submenu="appearance" aria-expanded="false" aria-controls="profile-appearance"><i class="profile-menu__icon profile-menu__icon--dark" aria-hidden="true"></i><span>Aparência<small data-theme-label>Escuro</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
                <button class="profile-menu__item" type="button" data-profile-submenu="language" aria-expanded="false" aria-controls="profile-language"><i class="profile-menu__icon profile-menu__icon--language" aria-hidden="true"></i><span>Idioma<small>Português (Brasil)</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
<button class="profile-menu__item" type="button" data-profile-submenu="news" aria-expanded="false" aria-controls="profile-news"><i class="profile-menu__icon profile-menu__icon--discover" aria-hidden="true"></i><span>Notícias<small data-news-preference-label>Finanças · PT / EN</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
                <div class="profile-menu__divider"></div>
                <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="profile-menu__item" type="submit"><i class="profile-menu__icon profile-menu__icon--logout" aria-hidden="true"></i><span>Sair</span></button></form>
            </div>
            <div class="profile-menu__submenu" id="profile-appearance" aria-label="Aparência" hidden>
                <button class="profile-menu__back" type="button"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i> Aparência</button>
                <button class="profile-menu__item" type="button" data-theme-choice="light" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--light" aria-hidden="true"></i><span>Claro</span><span class="profile-menu__check" aria-hidden="true"></span></button>
<button class="profile-menu__item" type="button" data-theme-choice="dark" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--dark" aria-hidden="true"></i><span>Escuro</span><span class="profile-menu__check" aria-hidden="true"></span></button>
<button class="profile-menu__item" type="button" data-theme-choice="system" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--system" aria-hidden="true"></i><span>Sistema</span><span class="profile-menu__check" aria-hidden="true"></span></button>
            </div>
            <div class="profile-menu__submenu profile-menu__languages" id="profile-language" aria-label="Idioma" hidden>
                <button class="profile-menu__back" type="button"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i> Idioma</button>
                <button class="profile-menu__item" type="button"><span>Português (Brasil)</span><span class="profile-menu__check" aria-hidden="true"></span></button>
                <button class="profile-menu__item" type="button"><span>English</span></button>
            </div>
<div class="profile-menu__submenu" id="profile-news" aria-label="Preferências de notícias" hidden><button class="profile-menu__back" type="button"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i> Notícias</button><p class="profile-news-heading">Assuntos</p><button class="profile-menu__item" type="button" data-news-topic="business" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--topic-business" aria-hidden="true"></i><span>Finanças</span><span class="profile-menu__check" aria-hidden="true"></span></button><button class="profile-menu__item" type="button" data-news-topic="technology" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--topic-technology" aria-hidden="true"></i><span>Tecnologia & Ciência</span><span class="profile-menu__check" aria-hidden="true"></span></button><button class="profile-menu__item" type="button" data-news-topic="culture" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--topic-culture" aria-hidden="true"></i><span>Arte & Cultura</span><span class="profile-menu__check" aria-hidden="true"></span></button><button class="profile-menu__item" type="button" data-news-topic="sports" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--topic-sports" aria-hidden="true"></i><span>Esportes</span><span class="profile-menu__check" aria-hidden="true"></span></button><button class="profile-menu__item" type="button" data-news-topic="entertainment" aria-pressed="false"><i class="profile-menu__icon profile-menu__icon--topic-entertainment" aria-hidden="true"></i><span>Entretenimento</span><span class="profile-menu__check" aria-hidden="true"></span></button><div class="profile-menu__divider"></div><p class="profile-news-heading">Idiomas das notícias</p><button class="profile-menu__item" type="button" data-news-languages="pt-en" aria-pressed="false"><span>Português e inglês</span><span class="profile-menu__check" aria-hidden="true"></span></button><button class="profile-menu__item" type="button" data-news-languages="all" aria-pressed="false"><span>Todos os idiomas</span><span class="profile-menu__check" aria-hidden="true"></span></button></div>
        </div>
    </aside>
    <button class="sidebar-backdrop" type="button" tabindex="-1" aria-label="Fechar menu" hidden></button>
    <main class="workspace__content" aria-label="Área de trabalho">
        <header class="workspace__header">
            <div class="workspace__mobile-brand">
                <button class="workspace__header-button workspace__menu-toggle" type="button" aria-label="Abrir menu lateral" aria-expanded="false" aria-controls="sidebar">
                    <span class="workspace__mobile-menu-icon" aria-hidden="true"></span>
                </button>
                <span class="workspace__brand-logo" role="img" aria-label="Ascensão"></span>
            </div>
            <span class="workspace__title">Descobrir</span>
            <button class="workspace__header-button mobile-discover-toggle" type="button" aria-label="Abrir Descobrir" aria-controls="mobile-discovery-panel" aria-expanded="false"><span class="sidebar__discover-icon" aria-hidden="true"></span></button>
        </header>

        <section class="news-page" aria-label="Descobrir notícias" data-user-id="{{ user.id }}">
            <nav class="discovery-nav" aria-label="Navegar pelas notícias">
                <button type="button" data-news-mode="for-you" aria-current="page">Para Você</button>
                <button type="button" data-news-mode="top">Top</button>
            </nav>
            <div class="discovery-layout">
                <div class="discovery-stories">
                    <div class="news-status" role="status" aria-live="polite"><span class="sidebar__discover-icon" aria-hidden="true"></span><p id="news-status-text">Buscando as últimas notícias…</p><button id="news-retry" type="button" hidden>Tentar novamente</button></div>
                    <div class="news-feed" id="news-feed" aria-busy="true"></div>
                    <div class="news-bottom"><p id="news-update" role="status"></p><button id="news-more" type="button" hidden>Carregar mais notícias</button><a href="https://newsapi.org/" target="_blank" rel="noopener noreferrer">Notícias via NewsAPI</a></div>
                </div>
                <aside class="discovery-widgets" aria-label="Interesses e clima">
                    <section class="discovery-panel weather-panel" aria-label="Previsão do tempo">
                        <button id="weather-locate" type="button">Usar minha localização</button>
                        <p id="weather-status" role="status">Permita sua localização para ver o clima da região.</p>
                        <div id="weather-content" hidden></div>
                        <a class="weather-credit" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Clima por Open-Meteo</a>
                    </section>
                </aside>
            </div>
            <noscript><p>Ative o JavaScript para carregar as notícias.</p></noscript>
        </section>
    </main>
    <dialog class="mobile-discovery-panel" id="mobile-discovery-panel" aria-label="Descobrir">
        <div class="mobile-discovery-panel__header"><button type="button" class="mobile-discovery-back" aria-label="Voltar"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i></button><span>Descobrir</span></div>
        <iframe title="Notícias do Descobrir" data-src="/descobrir.html?panel=1"></iframe>
    </dialog>
</body>
</html>
