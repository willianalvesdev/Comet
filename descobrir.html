<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="/static/js/cookies.js"></script>
    <link rel="stylesheet" href="/static/css/cookies.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171615">
    <meta name="color-scheme" content="dark">
    <title>Ascenda — Descobrir</title>
    <link rel="icon" type="image/png" href="/static/img/icons/widget-dark.png">
    <script src="./static/js/theme.js"></script>
    <link rel="stylesheet" href="./static/css/globals.css">
    <link rel="stylesheet" href="./static/css/principal.css">
    <link rel="stylesheet" href="./static/css/news.css">
    <script src="./static/js/sidebar.js" defer></script>
    <script src="./static/js/profile-menu.js" defer></script>
    <script src="./static/js/news.js" defer></script>
    <script src="/static/js/weather.js" defer></script>
    <script src="/static/js/discovery-panel.js" defer></script>
    <link rel="stylesheet" href="/static/css/sessions.css">
    <link rel="stylesheet" href="/static/css/chat-search.css">
    <script src="/static/js/chat-search.js" defer></script>
    <script src="/static/js/sessions.js" defer></script>
    <script src="/static/js/chat-preview.js" defer></script>
</head>
<body class="workspace">
{% with active_page='descobrir' %}{% include 'templates/partials/sidebar.html' %}{% endwith %}
    <button class="sidebar-backdrop" type="button" tabindex="-1" aria-label="Fechar menu" hidden></button>
    <main class="workspace__content" aria-label="Área de trabalho">
        <header class="workspace__header">
            <div class="workspace__mobile-brand">
                <button class="workspace__header-button workspace__menu-toggle" type="button" aria-label="Abrir menu lateral" aria-expanded="false" aria-controls="sidebar">
                    <span class="workspace__mobile-menu-icon" aria-hidden="true"></span>
                </button>
                <span class="workspace__brand-logo" role="img" aria-label="Ascenda"></span>
            </div>
                        <span class="workspace__title">Descobrir</span>
            <nav class="discovery-nav" aria-label="Navegar pelas notícias">
                <button type="button" data-news-mode="for-you" aria-current="page">Para Você</button>
                <button type="button" data-news-mode="top">Top</button>
            <details class="discovery-topics"><summary><span id="topic-label">Tópicos</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="discovery-dropdown"><button type="button" data-discovery-topic="technology" aria-pressed="false"><i class="discovery-icon icon-technology" aria-hidden="true"></i><span>Tecnologia & Ciência</span><i class="topic-check" aria-hidden="true"></i></button><button type="button" data-discovery-topic="business" aria-pressed="false"><i class="discovery-icon icon-business" aria-hidden="true"></i><span>Negócios</span><i class="topic-check" aria-hidden="true"></i></button><button type="button" data-discovery-topic="culture" aria-pressed="false"><i class="discovery-icon icon-culture" aria-hidden="true"></i><span>Arte & Cultura</span><i class="topic-check" aria-hidden="true"></i></button><button type="button" data-discovery-topic="sports" aria-pressed="false"><i class="discovery-icon icon-sports" aria-hidden="true"></i><span>Esportes</span><i class="topic-check" aria-hidden="true"></i></button><button type="button" data-discovery-topic="entertainment" aria-pressed="false"><i class="discovery-icon icon-entertainment" aria-hidden="true"></i><span>Entretenimento</span><i class="topic-check" aria-hidden="true"></i></button></div></details></nav>
            <button class="workspace__header-button mobile-discover-toggle" type="button" aria-label="Abrir Descobrir" aria-controls="mobile-discovery-panel" aria-expanded="false"><span class="sidebar__discover-icon" aria-hidden="true"></span></button>
        </header>

        <section class="news-page" aria-label="Descobrir notícias" data-user-id="{{ user.id }}">

            <div class="discovery-layout">
                <div class="discovery-stories">
                    <div class="news-status" hidden role="status" aria-live="polite"><span class="sidebar__discover-icon" aria-hidden="true"></span><p id="news-status-text">Buscando as últimas notícias…</p><button id="news-retry" type="button" hidden>Tentar novamente</button></div>
                    <div class="news-feed" id="news-feed" aria-busy="true"></div>
                    <div class="news-bottom"><p id="news-update" role="status"></p><button id="news-more" type="button" hidden>Carregar mais notícias</button></div>
                </div>
                <button class="weather-toggle" type="button" aria-label="Recolher painel" aria-expanded="true" aria-controls="weather-widgets"><img src="/static/img/icons/collapse-panel.svg" alt=""></button>
                <aside id="weather-widgets" class="discovery-widgets" aria-label="Interesses e clima">
                    <section class="discovery-panel weather-panel" aria-label="Previsão do tempo">
                        <p id="weather-status" role="status">Permita sua localização para ver o clima da região.</p>
                        <div id="weather-content" hidden></div>
                    </section>
                    <button id="weather-locate" type="button">Atualizar localização</button>
                </aside>
            </div>
            <noscript><p>Ative o JavaScript para carregar as notícias.</p></noscript>
        </section>
    </main>
    <dialog class="mobile-discovery-panel" id="mobile-discovery-panel" aria-label="Descobrir">
        <div class="mobile-discovery-panel__header"><button type="button" class="mobile-discovery-back" aria-label="Voltar"><i class="ui-arrow ui-arrow--left" aria-hidden="true"></i></button><span>Descobrir</span></div>
        <iframe title="Notícias do Descobrir" data-src="/descobrir.html?panel=1"></iframe>
    </dialog>
{% include 'settings.html' %}
<script src="/static/js/tooltips.js" defer></script>
</body>
</html>
