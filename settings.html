<link rel="stylesheet" href="/static/css/settings.css">
<dialog id="settings-dialog" aria-labelledby="settings-title">
<div class="settings-layout"><aside class="settings-sidebar"><label class="settings-search"><i class="settings-icon" style="--icon:url(/static/img/icons/settings-settings-search.svg)" aria-hidden="true"></i><input type="search" placeholder="Pesquisar configurações" aria-label="Pesquisar configurações"></label><p>Conta</p><nav aria-label="Configurações"><button type="button" data-settings-tab="account"><i class="settings-icon" style="--icon:url(/static/img/icons/settings-account.svg)" aria-hidden="true"></i>Conta</button><button type="button" data-settings-tab="preferences"><i class="settings-icon" style="--icon:url(/static/img/icons/settings-preferences.svg)" aria-hidden="true"></i>Preferências</button><button type="button" data-settings-tab="personalization"><i class="settings-icon" style="--icon:url(/static/img/icons/settings-personalization.svg)" aria-hidden="true"></i>Personalização</button><button type="button" data-settings-tab="memory"><i class="settings-icon" style="--icon:url(/static/img/icons/settings-memory.svg)" aria-hidden="true"></i>Configurações de memória</button><button type="button" data-settings-tab="notifications"><i class="settings-icon" style="--icon:url(/static/img/icons/notification.svg)" aria-hidden="true"></i>Notificações</button></nav></aside>
<button type="button" class="settings-close" aria-label="Fechar configurações">×</button>
<div class="settings-content"><h1 id="settings-title">Personalização</h1>
<form id="settings-form"><fieldset disabled><section data-settings-panel="personalization"><div class="settings-card"><label class="settings-row"><span>Como quer ser chamado</span><input name="name" type="text" maxlength="100" placeholder="Nome da sua conta"></label><label class="settings-row"><span>Sua profissão</span><input name="occupation" type="text" maxlength="200" placeholder="Engenheiro, estudante, etc."></label><label class="settings-row"><span>Nome da empresa</span><input name="company" type="text" maxlength="200" placeholder="Acme Corp, etc."></label><label class="settings-row"><span>Data de nascimento</span><input name="birth_date" type="date" maxlength="200" placeholder=""></label><label class="settings-row"><span>Gênero</span><select name="gender"><option value="">Selecionar</option><option>Feminino</option><option>Masculino</option><option>Não binário</option><option>Prefiro não informar</option></select></label>
<label class="settings-row"><span>Instruções personalizadas</span><textarea name="about" maxlength="2000" placeholder="Preferências, interesses e mais sobre você"></textarea></label></div>
<h2>Localização</h2><div class="settings-card settings-row"><div>Compartilhar localização<p class="settings-hint" id="settings-location-status">Compartilhe sua localização para personalizar as respostas.</p></div><button type="button" id="settings-location">Compartilhar</button></div>
<h2>Preferências de resposta</h2><p class="settings-hint">Defina como o Computer responde às suas perguntas.</p><div class="settings-card"><label class="settings-row"><span>Comprimento da resposta</span><select name="response_length"><option>Padrão</option><option>Curta</option><option>Detalhada</option></select></label><label class="settings-row"><span>Cabeçalhos e listas</span><select name="formatting"><option>Padrão</option><option>Usar quando possível</option><option>Evitar</option></select></label></div></section>
<section data-settings-panel="memory" hidden><div class="settings-card settings-row"><span>Memória entre conversas</span><button type="button" class="memory-switch" role="switch" aria-label="Memória entre conversas" aria-checked="true"><span></span></button></div><div class="settings-card"><label for="settings-summary">Resumo da memória</label><textarea id="settings-summary" name="summary" maxlength="6000" placeholder="As informações aprendidas sobre você aparecerão aqui."></textarea></div></section>
<div class="settings-actions"><button type="submit">Salvar alterações</button></div></fieldset></form>
<p id="settings-placeholder" hidden>Esta seção estará disponível em breve.</p><p id="settings-status" role="status"></p><button type="button" id="settings-reload" hidden>Tentar novamente</button></div></div></dialog>
<script src="/static/js/settings.js" defer></script>
